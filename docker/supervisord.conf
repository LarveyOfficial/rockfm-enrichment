[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root
loglevel=info

[program:playout]
; Serves the delayed HLS and the now-playing API. Started first so the
; AzuraCast source push has something to connect to.
command=python -m rockfm.playout
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ingest]
; Must keep up: the upstream live window is only ~24s.
command=python -m rockfm.ingest
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:analyzer]
command=python -m rockfm.analyzer
autorestart=true
startsecs=5
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:azuracast]
; Exits immediately and stays down when no AzuraCast target is configured.
command=python -m rockfm.azuracast
autorestart=true
startsecs=5
priority=50
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
