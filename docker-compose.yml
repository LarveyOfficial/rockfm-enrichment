services:
  rockfm:
    build: .
    container_name: rockfm-enrichment
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    # Only what cannot change while running. Everything else -- the AzuraCast
    # integration, public URL, display language, classification thresholds --
    # is configured from the dashboard and stored in the database, so changing
    # it never costs a hole in the recording.
    environment:
      LOCAL_TZ: America/New_York
      BUFFER_HOURS: "24"
      SEED_ON_START: "true"
      RECOGNIZER: shazamio
      SEGMENTER: ina
      AZURACAST_DJ_CODEC: mp3
